# Render Blueprint - https://render.com/docs/blueprint-spec
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file and creates the service below; env vars marked `sync: false` are
# left for you to fill in by hand (secrets aren't committed to the repo).
#
# Before deploying, create a free MySQL database (e.g. on Aiven - see the
# README's "Deploying" section) and have its connection string and CA
# certificate ready.
services:
  - type: web
    runtime: docker
    name: mineazy-wms
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true          # random signing key, Render fills this in
      - key: DATABASE_URL
        sync: false                  # e.g. mysql+pymysql://user:pass@host:port/db
      - key: DB_SSL_CA
        value: /etc/secrets/ca.pem   # only used if that secret file exists
      - key: DEBUG
        value: "false"
      # The weekly demand model's neural candidates (torch-based) are the
      # heaviest and slowest to import - off by default on the free plan's
      # 512MB RAM. Flip to "true" once on a bigger plan if you want them.
      - key: WEEKLY_ESRNN
        value: "false"
      # weekly_esrnn_ratio is a SEPARATE flag from weekly_esrnn (a different
      # candidate model, gated independently in _neural_forecasts()) - easy
      # to miss, and WEEKLY_ESRNN=false alone does NOT turn it off. This was
      # very likely the dominant cause of the 512MB OOM crashes: it was
      # still fitting a neural net fresh on every uncached request.
      - key: WEEKLY_ESRNN_RATIO
        value: "false"
      - key: WEEKLY_NEURALPROPHET
        value: "false"
      - key: WEEKLY_LSTM
        value: "false"
      # XGBoost/LightGBM, fit fresh across every (branch, sku) series on the
      # first uncached request after a data change, also OOM'd the free
      # plan's 512MB once the real historical import pushed the series count
      # into the tens of thousands - off for the same reason as the above.
      # The remaining candidates (old_excel, snaive, damped_mean, sba) are
      # plain per-series numpy math, not a fitted model, so they're cheap.
      - key: WEEKLY_GBM
        value: "false"
      - key: WEEKLY_LGBM
        value: "false"
