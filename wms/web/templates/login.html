<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in — Mineazy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 :root{--brand:#3b4bc0;--brand-deep:#2b3a8c;--ink:#1f2430;--muted:#6b7280}
 *{box-sizing:border-box}
 body{margin:0;font:14px/1.55 "Inter",-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:#f4f5fa;color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center}
 .box{background:#fff;border:1px solid #e6e8f0;border-radius:16px;width:380px;overflow:hidden;
      box-shadow:0 10px 30px rgba(16,24,40,.06)}
 .box-body{padding:26px 32px 32px}
 .brand-banner{display:block;width:100%}
 label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:500}
 label:first-of-type{margin-top:0}
 input{width:100%;padding:11px 13px;border:1px solid #d7dae5;border-radius:10px;font:inherit}
 input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,75,192,.12)}
 button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:10px;background:var(--brand-deep);
        color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
 button:hover{background:var(--brand)}
 .flash{margin-top:14px;padding:10px 12px;border-radius:9px;font-size:13px;background:#fee2e2;color:#b91c1c}
 .flash.success{background:#e6f4ec;color:#0f7b3d}
 .signup-link{display:block;margin-top:18px;font-size:13px;color:var(--muted);text-align:center;text-decoration:none}
 .signup-link:hover{color:var(--ink)}
</style></head><body>
<div class="box">
  <img class="brand-banner" src="/static/img/logo.png" alt="Mineazy Mining Solutions">
  <form class="box-body" method="post" action="/login">
    <label>Username</label>
    <input name="username" autofocus autocomplete="username">
    <label>Password</label>
    <input name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
    {% for f in flashes %}<div class="flash {{ f.c }}">{{ f.m }}</div>{% endfor %}
    <a class="signup-link" href="/signup">Don&rsquo;t have an account? Sign up</a>
  </form>
</div>
</body></html>
