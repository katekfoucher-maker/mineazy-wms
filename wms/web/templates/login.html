<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in — Mineazy</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 :root{--brand:#3b4bc0;--brand-deep:#2b3a8c;--ink:#1f2430;--muted:#6b7280}
 *{box-sizing:border-box}
 body{margin:0;font:14px/1.55 "Inter",-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:#f4f5fa;color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center}
 .box{background:#fff;border:1px solid #e6e8f0;border-radius:16px;width:380px;overflow:hidden;
      box-shadow:0 10px 30px rgba(16,24,40,.06)}
 .box-body{padding:26px 32px 32px}
 .brand-banner{display:block;width:100%}
 label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px;font-weight:500}
 label:first-of-type{margin-top:0}
 input{width:100%;padding:11px 13px;border:1px solid #d7dae5;border-radius:10px;font:inherit}
 input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(59,75,192,.12)}
 button{width:100%;margin-top:22px;padding:12px;border:0;border-radius:10px;background:var(--brand-deep);
        color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
 button:hover{background:var(--brand)}
 a.google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
        padding:11px;border:1px solid #d7dae5;border-radius:10px;
        background:#fff;color:var(--ink);font:inherit;font-weight:600;cursor:pointer;
        text-decoration:none}
 a.google:hover{background:#f7f8fb}
 a.google svg{width:18px;height:18px;flex:none}
 .divider{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px}
 .divider::before,.divider::after{content:"";flex:1;height:1px;background:#e6e8f0}
 .flash{margin-top:14px;padding:10px 12px;border-radius:9px;font-size:13px;background:#fee2e2;color:#b91c1c}
 .flash.success{background:#e6f4ec;color:#0f7b3d}
 .signup-link{display:block;margin-top:18px;font-size:13px;color:var(--muted);text-align:center;text-decoration:none}
 .signup-link:hover{color:var(--ink)}
 .pw{position:relative}
 .pw input{padding-right:44px}
 .pw .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:36px;height:36px;
          margin:0;padding:0;background:transparent;color:var(--muted);border-radius:8px;
          display:flex;align-items:center;justify-content:center}
 .pw .eye:hover{background:#f1f2f8;color:var(--ink)}
 .pw .eye svg{width:20px;height:20px}
 .pw .eye .off{display:none}
 .pw .eye.on .off{display:block}
 .pw .eye.on .show{display:none}
</style></head><body>
<div class="box">
  <img class="brand-banner" src="/static/img/logo.png" alt="Mineazy Mining Solutions">
  <div class="box-body">
    {% if google_configured %}
    <a class="google" href="/auth/google/start?from_page=login">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.4 0 6.4 1.2 8.8 3.5l6.6-6.6C35.3 2.5 30 0 24 0 14.6 0 6.5 5.4 2.5 13.2l7.7 6C12.1 13 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.6c-.5 2.9-2.2 5.4-4.7 7l7.4 5.7c4.3-4 6.8-9.9 6.8-17.2z"/><path fill="#FBBC05" d="M10.2 19.2c-.5 1.5-.8 3.1-.8 4.8s.3 3.3.8 4.8l-7.7 6C.9 31.4 0 27.8 0 24s.9-7.4 2.5-10.8l7.7 6z"/><path fill="#34A853" d="M24 48c6 0 11.3-2 15-5.4l-7.4-5.7c-2 1.4-4.6 2.2-7.6 2.2-6.4 0-11.9-3.5-13.8-9.4l-7.7 6C6.5 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google</a>
    <div class="divider">or sign in with your username</div>
    {% endif %}
    <form method="post" action="/login">
      <label>Username</label>
      <input name="username" autofocus autocomplete="username">
      <label>Password</label>
      <div class="pw">
        <input name="password" id="pw-input" type="password" autocomplete="current-password">
        <button type="button" class="eye" id="pw-eye" aria-label="Show password" aria-pressed="false" title="Show password">
          <svg class="show" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 7 11 7a19.8 19.8 0 0 1-3.17 4.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>
        </button>
      </div>
      <button type="submit">Sign in</button>
    </form>
    {% for f in flashes %}<div class="flash {{ f.c }}">{{ f.m }}</div>{% endfor %}
    <a class="signup-link" href="/signup">Don&rsquo;t have an account? Sign up</a>
  </div>
</div>
<script>
(function(){
  var inp = document.getElementById('pw-input'), eye = document.getElementById('pw-eye');
  if (!inp || !eye) return;
  eye.addEventListener('click', function(){
    var show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    eye.classList.toggle('on', show);
    eye.setAttribute('aria-pressed', show ? 'true' : 'false');
    var t = show ? 'Hide password' : 'Show password';
    eye.setAttribute('aria-label', t); eye.title = t;
    inp.focus();
  });
})();
</script>
</body></html>
